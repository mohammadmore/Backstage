        // =====================================
        // تعریف رویداد جدید (ویزارد پرزنت هیبریدی هوشمند)
        // =====================================
        function EventCreate({ md, onDone, onCancel, user }) {
            const [step, setStep] = useState(0);
            const [form, setForm] = useState({ title: '', event_type: '', org_id: '', contact_name: '', venue_id: '', guest_count: '', start_date: '', end_date: '', selectedSvc: [] });
            
            const [hybridAnswers, setHybridAnswers] = useState({});

            const HYBRID_QUESTIONS = [
                { id: 'q_intl', text: 'آیا در رویداد شما مهمان خارجی یا سخنران بین‌المللی حضور دارد؟', keywords: ['مترجم', 'انگلیسی', 'ارزی', 'vip', 'وی آی پی', 'تشریفات'] },
                { id: 'q_outdoor', text: 'آیا بخش اصلی یا جانبی رویداد در فضای باز (باغ/روف‌گاردن) است؟', keywords: ['فضای باز', 'باغ', 'چادر', 'اسپیس', 'مه‌پاش', 'سایبان'] },
                { id: 'q_stream', text: 'آیا رویداد نیاز به پخش زنده (استریم) یا برگزاری وبینار موازی دارد؟', keywords: ['پخش زنده', 'استریم', 'وبینار', 'آپارات', 'اینترنت', 'سیار'] },
                { id: 'q_food', text: 'آیا پذیرایی اصلی (ناهار/شام گرم) برای مهمانان در نظر دارید؟', keywords: ['شام', 'ناهار', 'چلو', 'کباب', 'بوفه گرم', 'پذیرایی'] }
            ];

            const categories = md.categories || [];
            const uncategorizedServices = (md.services || []).filter(s => !s.category_id);
            const totalSteps = 1 + 2 + categories.length + (uncategorizedServices.length > 0 ? 1 : 0) + 1; 

            const toggleService = (svc, pkg) => {
                const isSel = form.selectedSvc.some(s => s.id === svc.id && s.name.includes(pkg.name));
                let newSvc = form.selectedSvc.filter(s => s.id !== svc.id); 
                if (!isSel) {
                    const unitPrice = Number(pkg.price) || 0;
                    const qty = svc.cost_type === 'individual' ? (parseInt(form.guest_count) || 1) : 1;
                    const total = unitPrice > 0 ? unitPrice * qty : ''; 
                    newSvc.push({ id: svc.id, name: svc.name + ' - ' + pkg.name, cost_type: svc.cost_type, unit_price: unitPrice || '', qty: qty, price: total, tasks: pkg.tasks });
                }
                setForm({...form, selectedSvc: newSvc});
            };

            const saveEvent = async () => { 
                if(!form.title) return alert("نام رویداد الزامی است"); 
                const res = await safeFetch('create_event', { ...form, selected_services: form.selectedSvc, admin_name: user.full_name }); 
                if(res) onDone(); 
            };

            const renderStepContent = () => {
                if (step === 0) {
                    return (
                        <div className="space-y-6 fade-in max-w-3xl mx-auto mt-4">
                            <div className="text-center mb-8">
                                <h3 className="text-2xl font-black text-indigo-900 dark:text-indigo-300 mb-2">پرسشنامه هوشمند نیازسنجی</h3>
                                <p className="text-slate-500 dark:text-slate-400 font-bold text-sm">پاسخ به این سوالات، خدمات اضافی را فیلتر کرده و زمان پرزنت را کاهش می‌دهد.</p>
                            </div>
                            <div className="space-y-4">
                                {HYBRID_QUESTIONS.map((q, idx) => (
                                    <div key={q.id} className="bg-white dark:bg-slate-800 p-5 rounded-2xl border-2 border-slate-100 dark:border-slate-700 shadow-sm hover:border-indigo-300 transition-colors">
                                        <p className="font-bold text-slate-800 dark:text-white mb-4 text-lg">{toPersianNum(idx+1)}. {q.text}</p>
                                        <div className="flex flex-wrap gap-3">
                                            <button onClick={()=>setHybridAnswers({...hybridAnswers, [q.id]: 'yes'})} className={`flex-1 py-3 rounded-xl font-bold border-2 transition-all ${hybridAnswers[q.id] === 'yes' ? 'bg-green-100 dark:bg-green-900/40 border-green-500 text-green-700 dark:text-green-400' : 'bg-slate-50 dark:bg-slate-700 border-transparent text-slate-600 dark:text-slate-300'}`}>بله</button>
                                            <button onClick={()=>setHybridAnswers({...hybridAnswers, [q.id]: 'no'})} className={`flex-1 py-3 rounded-xl font-bold border-2 transition-all ${hybridAnswers[q.id] === 'no' ? 'bg-red-100 dark:bg-red-900/40 border-red-500 text-red-700 dark:text-red-400' : 'bg-slate-50 dark:bg-slate-700 border-transparent text-slate-600 dark:text-slate-300'}`}>خیر</button>
                                            <button onClick={()=>setHybridAnswers({...hybridAnswers, [q.id]: 'unknown'})} className={`flex-1 py-3 rounded-xl font-bold border-2 transition-all ${hybridAnswers[q.id] === 'unknown' ? 'bg-amber-100 dark:bg-amber-900/40 border-amber-500 text-amber-700 dark:text-amber-400' : 'bg-slate-50 dark:bg-slate-700 border-transparent text-slate-600 dark:text-slate-300'}`}>معلوم نیست</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                if (step === 1) {
                    const selOrg = (md.organizations||[]).find(o => o.id == form.org_id);
                    const orgContacts = selOrg && selOrg.contacts ? JSON.parse(selOrg.contacts) : [];

                    return (
                        <div className="space-y-6 fade-in max-w-2xl mx-auto mt-4">
                            <h3 className="text-xl font-bold mb-6 text-indigo-900 dark:text-indigo-300 border-b dark:border-slate-700 pb-2">گام ۱: پرونده و زمان‌بندی</h3>
                            <input type="text" placeholder="عنوان رویداد *" value={form.title} onChange={e => setForm({...form, title: e.target.value})} className="w-full border-2 dark:border-slate-600 p-4 rounded-xl outline-none focus:border-indigo-500 font-black text-xl shadow-sm dark:bg-slate-700 dark:text-white" autoFocus />
                            
                            <div className="space-y-4">
                                <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                                    <label className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 block">تاریخ و ساعت شروع رویداد</label>
                                    <JalaliDatePicker value={form.start_date} onChange={val => setForm({...form, start_date: val})} />
                                </div>
                                <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                                    <label className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 block">تاریخ و ساعت پایان رویداد</label>
                                    <JalaliDatePicker value={form.end_date} onChange={val => setForm({...form, end_date: val})} />
                                </div>
                            </div>

                            <select value={form.org_id} onChange={e => setForm({...form, org_id: e.target.value, contact_name: ''})} className="w-full border-2 dark:border-slate-600 p-4 rounded-xl outline-none font-bold bg-white dark:bg-slate-700 dark:text-white shadow-sm cursor-pointer mt-4">
                                <option value="">(انتخاب مشتری / سازمان)</option>
                                {(md.organizations || []).map(org => <option key={org.id} value={org.id}>{toPersianNum(org.name)}</option>)}
                            </select>

                            {form.org_id && orgContacts.length > 0 && (
                                <div className="p-4 bg-indigo-50 dark:bg-indigo-900/30 rounded-xl border border-indigo-100 dark:border-indigo-800 slide-down">
                                    <label className="text-sm font-bold text-indigo-900 dark:text-indigo-300 mb-2 block">مدیر هماهنگی پروژه (نماینده کارفرما):</label>
                                    <select value={form.contact_name} onChange={e => setForm({...form, contact_name: e.target.value})} className="w-full border-2 dark:border-slate-600 p-3.5 rounded-xl outline-none font-bold bg-white dark:bg-slate-700 dark:text-white">
                                        <option value="">(انتخاب نماینده)</option>
                                        {orgContacts.map((c, i) => <option key={i} value={c.name}>{toPersianNum(c.name)} - {toPersianNum(c.phone)}</option>)}
                                    </select>
                                </div>
                            )}
                        </div>
                    );
                }

                if (step === 2) {
                    const guestsNum = parseInt(form.guest_count) || 0;
                    const venues = (md.venues || []).map(v => {
                        const diff = v.capacity - guestsNum;
                        let label = '', color = '';
                        if(guestsNum > 0) {
                            if(diff < 0) { label = 'کوچک'; color = 'text-red-500 bg-red-50 dark:bg-red-900/20 border-red-200 opacity-60'; }
                            else if(diff <= 50) { label = 'ایده‌آل'; color = 'text-green-800 dark:text-green-300 bg-green-50 dark:bg-green-900/30 border-green-400 font-black shadow-lg ring-2 ring-green-400 transform scale-[1.02]'; }
                            else { label = 'بزرگ'; color = 'text-slate-600 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'; }
                        } else { color = 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hidden'; }
                        return { ...v, diff, label, color };
                    }).sort((a, b) => { if(guestsNum === 0) return 0; if(a.diff < 0 && b.diff >= 0) return 1; if(a.diff >= 0 && b.diff < 0) return -1; return a.diff - b.diff; });

                    return (
                        <div className="space-y-5 fade-in max-w-2xl mx-auto mt-4 flex flex-col h-full">
                            <div>
                                <h3 className="text-xl font-bold mb-4 text-indigo-900 dark:text-indigo-300 border-b dark:border-slate-700 pb-2">گام ۲: ابعاد و لوکیشن</h3>
                                <input type="number" placeholder="تعداد مهمانان را وارد کنید..." value={form.guest_count} onChange={e => setForm({...form, guest_count: e.target.value})} className="w-full border-2 dark:border-slate-600 p-5 rounded-2xl outline-none focus:border-indigo-500 text-2xl font-black text-center shadow-inner bg-slate-50 dark:bg-slate-700 focus:bg-white dark:focus:bg-slate-800 dark:text-white transition-all placeholder:text-slate-300" dir="ltr" />
                            </div>
                            
                            <div className="flex-1 overflow-y-auto custom-scroll pr-2 space-y-3 pb-4">
                                {guestsNum === 0 ? (
                                    <div className="h-full flex items-center justify-center text-center p-6 pulse-text">
                                        <p className="text-lg font-bold text-slate-400">لطفاً تعداد حدودی مهمانان را در کادر بالا وارد کنید تا هوش مصنوعی، بهترین سالن‌ها را استخراج کند...</p>
                                    </div>
                                ) : (
                                    venues.map(v => (
                                        <div key={v.id} onClick={() => setForm({...form, venue_id: v.id})} className={`p-5 border-2 rounded-2xl cursor-pointer flex justify-between items-center transition-all slide-down ${form.venue_id == v.id ? 'ring-4 ring-indigo-600 bg-indigo-50 dark:bg-indigo-900/30 border-indigo-600 shadow-lg' : v.color}`}>
                                            <div className="font-black text-lg">{toPersianNum(v.name)} <span className="text-sm font-bold flex items-center gap-2 mt-2 opacity-80">ظرفیت: {toPersianNum(v.capacity)} نفر {v.label && <span className="bg-white/80 dark:bg-slate-900/50 px-2 py-0.5 rounded-md text-[11px] uppercase tracking-wider">{v.label}</span>}</span></div>
                                            <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center shrink-0 shadow-sm ${form.venue_id == v.id ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800'}`}>{form.venue_id == v.id && <Icons.Check />}</div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    );
                }

                if (step > 2 && step < totalSteps - 1) {
                    const catIndex = step - 3; let catName = "سایر خدمات"; let catServices = [];
                    if (catIndex < categories.length) { catName = categories[catIndex].name; catServices = (md.services || []).filter(s => s.category_id === categories[catIndex].id); } else { catServices = uncategorizedServices; }
                    
                    const filteredServices = catServices.filter(svc => {
                        let keep = true; let isConditional = false;
                        HYBRID_QUESTIONS.forEach(q => {
                            const isMatch = q.keywords.some(kw => svc.name.includes(kw));
                            if(isMatch) {
                                if(hybridAnswers[q.id] === 'no') keep = false;
                                if(hybridAnswers[q.id] === 'unknown') isConditional = true;
                            }
                        });
                        svc._conditional = isConditional; return keep;
                    });
                    filteredServices.sort((a,b) => (a._conditional === b._conditional) ? 0 : a._conditional ? 1 : -1);

                    return (
                        <div className="fade-in h-full flex flex-col pt-2 max-w-4xl mx-auto">
                            <h3 className="text-2xl font-black mb-6 text-indigo-900 dark:text-indigo-300 border-b-2 border-indigo-100 dark:border-slate-700 pb-3">{toPersianNum(catName)}</h3>
                            <div className="flex-1 overflow-y-auto custom-scroll pr-2 pb-6 space-y-5">
                                {filteredServices.map((svc) => {
                                    let pkgs = []; try { pkgs = svc.packages ? JSON.parse(svc.packages) : []; } catch(e) {}
                                    return (
                                        <div key={svc.id} className={`border p-5 rounded-2xl bg-white dark:bg-slate-800 shadow-sm hover:shadow-md transition-shadow ${svc._conditional ? 'border-amber-200 dark:border-amber-700 opacity-90' : 'border-slate-200 dark:border-slate-700'}`}>
                                            <div className="flex items-center gap-2 mb-4">
                                                <div className="font-black text-xl text-slate-800 dark:text-white">{toPersianNum(svc.name)}</div>
                                                {svc._conditional && <span className="bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 text-[10px] px-2 py-0.5 rounded-full pulse-text">✨ در صورت نیاز</span>}
                                            </div>
                                            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                                {pkgs.map((pkg, idx) => {
                                                    const isSel = form.selectedSvc.some(s => s.id === svc.id && s.name.includes(pkg.name));
                                                    return (
                                                        <div key={idx} onClick={() => toggleService(svc, pkg)} className={`p-4 border-2 rounded-xl cursor-pointer transition-all ${isSel ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/30 shadow-md ring-1 ring-indigo-500' : 'border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 hover:border-indigo-300 dark:hover:border-indigo-500 hover:bg-white dark:hover:bg-slate-700'}`}>
                                                            <div className="flex justify-between items-start mb-3 gap-2">
                                                                <span className="font-bold text-sm text-slate-700 dark:text-slate-200 leading-relaxed">{toPersianNum(pkg.name)}</span>
                                                                <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 ${isSel?'bg-indigo-600 border-indigo-600 text-white':'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700'}`}>{isSel && <Icons.Check/>}</div>
                                                            </div>
                                                            <div className="text-xs font-black text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 px-2.5 py-1.5 rounded-lg inline-block border border-slate-200 dark:border-slate-600 shadow-sm">{pkg.price ? toPersianNum(Number(pkg.price).toLocaleString()) + ' ت' : 'نیاز به استعلام (TBD)'}</div>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    );
                }

                if (step === totalSteps - 1) {
                    const totalCost = form.selectedSvc.reduce((acc, curr) => acc + (Number(curr.price) || 0), 0);
                    return (
                        <div className="fade-in max-w-2xl mx-auto mt-4 text-center">
                            <h3 className="text-3xl font-black mb-8 text-slate-800 dark:text-white border-b dark:border-slate-700 pb-4">پیش‌فاکتور نهایی</h3>
                            <div className="bg-gradient-to-r from-indigo-50 to-blue-50 dark:from-indigo-900/40 dark:to-blue-900/40 p-8 sm:p-12 rounded-[2.5rem] border-2 border-indigo-100 dark:border-indigo-800 mb-8 shadow-inner">
                                <p className="text-base font-bold text-indigo-500 dark:text-indigo-400 mb-4">برآورد مالی حدودی پروپوزال</p>
                                <div className="text-5xl sm:text-6xl font-black text-indigo-700 dark:text-indigo-300 tracking-tight" dir="ltr">{toPersianNum(totalCost.toLocaleString())}</div>
                                <div className="text-xl font-bold text-indigo-400 mt-4">تومان</div>
                            </div>
                            <div className="text-sm text-slate-500 dark:text-slate-400 font-bold bg-amber-50 dark:bg-amber-900/20 p-5 rounded-2xl border border-amber-200 dark:border-amber-800 shadow-sm">قیمت‌های TBD و ضرایب تخفیف/مالیات در اتاق فرمان رویداد قابل ویرایش هستند.</div>
                        </div>
                    );
                }
            };

            return (
                <div className="fixed inset-0 z-[200] bg-slate-900/80 backdrop-blur-sm flex justify-center items-center sm:p-6">
                    <div className="bg-slate-50 dark:bg-slate-900 w-full h-full sm:h-[95vh] sm:max-w-5xl sm:rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col transition-colors duration-300">
                        <div className="p-6 bg-white dark:bg-slate-800 border-b dark:border-slate-700 relative z-10 shadow-sm flex justify-between items-center">
                            <h2 className="font-black text-2xl text-indigo-900 dark:text-indigo-300">ایجاد پرونده رویداد</h2>
                            <button onClick={onCancel} className="w-10 h-10 flex items-center justify-center bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-full font-bold transition-colors shadow-sm">✕</button>
                        </div>
                        <div className="px-6 pt-4 pb-2 bg-white dark:bg-slate-800">
                            <div className="flex gap-1.5 h-2.5 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden px-1">{Array.from({length: totalSteps}).map((_, i) => <div key={i} className={`flex-1 rounded-full ${i <= step ? 'bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.6)]' : 'bg-slate-200 dark:bg-slate-600'} transition-all duration-500`}></div>)}</div>
                        </div>
                        <div className="p-4 sm:p-8 flex-1 overflow-hidden relative">{renderStepContent()}</div>
                        
                        <div className="p-4 sm:p-6 bg-white dark:bg-slate-800 border-t dark:border-slate-700 flex flex-col sm:flex-row gap-4 z-10 shadow-[0_-4px_15px_rgba(0,0,0,0.02)] justify-between items-center">
                            <div className="flex gap-3 w-full sm:w-auto">
                                <button onClick={onCancel} className="flex-1 sm:flex-none px-6 py-4 bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-xl font-bold hover:bg-red-100 dark:hover:bg-red-900/50 transition-colors border border-red-100 dark:border-red-900/30">انصراف و بستن</button>
                                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="flex-1 sm:flex-none px-6 py-4 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 disabled:opacity-50 transition-colors">مرحله قبل</button>
                            </div>
                            <div className="w-full sm:w-auto mt-2 sm:mt-0">
                                {step < totalSteps - 1 ? 
                                    <button onClick={() => setStep(step + 1)} className="w-full sm:w-auto px-10 bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-black text-lg shadow-lg transition-transform active:scale-[0.98]">تایید و ادامه</button> : 
                                    <button onClick={saveEvent} className="w-full sm:w-auto px-10 bg-green-600 hover:bg-green-700 text-white py-4 rounded-xl font-black text-xl shadow-[0_4px_15px_rgba(22,163,74,0.4)] transition-transform active:scale-[0.98]">خلق اتاق فرمان</button>
                                }
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // =====================================
        // داشبورد اصلی رویدادها (لیست)
        // =====================================
        function EventDashboard({ md, loadMd, user, onNewEvent }) {
            const [selectedId, setSelectedId] = useState(null);
            const [eventsList, setEventsList] = useState([]);
            
            const loadEvents = () => safeFetch('get_events').then((res) => { if(res) setEventsList(res); });
            useEffect(() => { loadEvents(); }, []);

            if(selectedId) return <EventDetail eventId={selectedId} onBack={() => {setSelectedId(null); loadEvents();}} user={user} md={md} />;

            return (
                <div className="fade-in mt-8">
                    <div className="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4 bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-[2rem] shadow-sm border border-slate-200 dark:border-slate-700">
                        <div className="text-center sm:text-right w-full sm:w-auto">
                            <h3 className="text-3xl font-black text-slate-800 dark:text-white">داشبورد فرماندهی رویدادها</h3>
                            <p className="text-slate-500 dark:text-slate-400 font-bold text-sm mt-2">مدیریت و کنترل لحظه‌ای پروژه‌های در حال اجرا</p>
                        </div>
                        <button onClick={onNewEvent} className="w-full sm:w-auto bg-indigo-600 text-white px-10 py-5 rounded-2xl font-black text-lg shadow-[0_4px_15px_rgba(79,70,229,0.3)] hover:bg-indigo-700 transition-transform active:scale-[0.98] flex items-center justify-center gap-3"><Icons.Plus /> تعریف رویداد جدید</button>
                    </div>
                    
                    {eventsList.length === 0 ? (
                        <div className="text-center py-32 bg-white dark:bg-slate-800 rounded-[3rem] border-2 border-dashed border-slate-300 dark:border-slate-700 shadow-sm mt-4">
                            <div className="bg-indigo-50 dark:bg-indigo-900/30 text-indigo-400 dark:text-indigo-500 w-28 h-28 rounded-full flex items-center justify-center mx-auto mb-6"><Icons.Building /></div>
                            <h3 className="text-3xl font-black text-slate-800 dark:text-white mb-4">پروژه‌ای در دست اجرا نیست</h3>
                            <p className="text-slate-500 dark:text-slate-400 font-bold max-w-sm mx-auto px-4 leading-relaxed">برای شروع یک برنامه‌ریزی قدرتمند، روی دکمه آبی رنگ در بالای صفحه کلیک کنید.</p>
                        </div>
                    ) : (
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {eventsList.map(ev => (
                                <div key={ev.id} className="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-[2rem] shadow-sm border border-slate-200 dark:border-slate-700 hover:border-indigo-400 dark:hover:border-indigo-500 hover:shadow-xl transition-all relative group flex flex-col h-full cursor-pointer" onClick={() => setSelectedId(ev.id)}>
                                    <div className="flex-1">
                                        <div className="flex justify-between items-start mb-6">
                                            {ev.org_logo ? <img src={ev.org_logo} className="w-14 h-14 rounded-xl object-cover border border-slate-200 dark:border-slate-700 shadow-sm bg-white" /> : <div className="w-14 h-14 bg-slate-100 dark:bg-slate-700 rounded-xl flex items-center justify-center text-slate-400 dark:text-slate-500"><Icons.Building/></div>}
                                            <span className={`text-[10px] font-bold px-3 py-1.5 rounded-lg border shadow-sm ${ev.status==='completed'?'bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800':ev.status==='confirmed'?'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 border-blue-200 dark:border-blue-800':'bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 border-amber-200 dark:border-amber-800'}`}>{ev.status==='completed'?'پایان یافته':ev.status==='confirmed'?'قطعی':'پیش‌نویس'}</span>
                                        </div>
                                        <h4 className="font-black text-2xl mb-4 text-slate-800 dark:text-white leading-snug">{toPersianNum(ev.title)}</h4>
                                        <div className="space-y-3 mb-6">
                                            <p className="text-sm font-bold text-slate-600 dark:text-slate-300 flex items-center gap-2 bg-slate-50 dark:bg-slate-700 px-3 py-2 rounded-lg border border-slate-100 dark:border-slate-600"><Icons.Building/> {toPersianNum(ev.org_name) || 'کارفرمای نامشخص'}</p>
                                            <p className="text-sm text-slate-500 dark:text-slate-400 font-bold flex items-center gap-2 bg-slate-50 dark:bg-slate-700 px-3 py-2 rounded-lg border border-slate-100 dark:border-slate-600" dir="ltr"><Icons.Calendar/> {ev.start_date ? toJalaliDate(ev.start_date) : 'بدون تاریخ'}</p>
                                        </div>
                                    </div>
                                    <div className="w-full bg-slate-50 dark:bg-slate-700 group-hover:bg-indigo-600 dark:group-hover:bg-indigo-500 group-hover:text-white group-hover:border-indigo-600 dark:group-hover:border-indigo-500 text-indigo-600 dark:text-indigo-400 py-4 rounded-xl font-black border border-slate-200 dark:border-slate-600 transition-colors text-center shadow-sm">ورود به اتاق فرمان</div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // =====================================
        // اجرای اصلی (App) و مدیریت تم تاریک
        // =====================================
        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('MASTER'); 
            const [md, setMd] = useState({});
            const [showCreate, setShowCreate] = useState(false);
            const [notifs, setNotifs] = useState([]);
            const [showNotifPanel, setShowNotifPanel] = useState(false);
            const [theme, setTheme] = useState('light');

            const loadMd = () => safeFetch('get_master_data').then((res) => { if (res) setMd(res); });
            
            const fetchNotifs = async () => { 
                if(user && user.role==='superadmin') { 
                    const res = await safeFetch(`get_notifications&user_id=${user.id}&role=${user.role}`); 
                    if(res) setNotifs(res); 
                } 
            };

            const toggleTheme = async () => {
                const newTheme = theme === 'light' ? 'dark' : 'light';
                setTheme(newTheme);
                if (newTheme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                if (user) await safeFetch('update_theme', { user_id: user.id, theme: newTheme });
            };

            useEffect(() => {
                if (user) {
                    if (user.theme_pref === 'dark') { setTheme('dark'); document.documentElement.classList.add('dark'); } 
                    else { setTheme('light'); document.documentElement.classList.remove('dark'); }
                    
                    if (user.role === 'superadmin') { loadMd(); fetchNotifs(); const i = setInterval(fetchNotifs, 15000); return ()=>clearInterval(i); }
                }
            }, [user]);

            const markNotifRead = async (id) => { await safeFetch('mark_notif_read', {id}); fetchNotifs(); };

            const resolveDelegation = async (delId, taskId, toUserId, status, notifId) => {
                await safeFetch('resolve_delegation', { delegation_id: delId, task_id: taskId, to_user_id: toUserId, status: status, notif_id: notifId, event_id: md?.events?.[0]?.id || 0, user_name: user.full_name });
                fetchNotifs(); 
            };

            if (!user) return (
                <div className="flex items-center justify-center min-h-screen bg-slate-900 px-4 bg-[url('data:image/svg+xml;base64,PHN2ZyBvcGFjaXR5PSIwLjA1IiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0MCIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiLz48L3N2Zz4=')]">
                    <div className="bg-white dark:bg-slate-800 p-8 sm:p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md text-center fade-in border-t-8 border-indigo-600 relative overflow-hidden transition-colors duration-300">
                        <div className="w-20 h-20 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner"><Icons.Tent /></div>
                        <h1 className="text-3xl font-black mb-8 text-slate-800 dark:text-white tracking-tight">ای‌ونت مستر</h1>
                        <form onSubmit={async(e)=>{e.preventDefault(); const res = await safeFetch('login', {username:e.target.u.value, password:e.target.p.value}); if(res&&res.success)setUser(res.user);}} className="space-y-4">
                            <input name="u" type="text" placeholder="نام کاربری" className="w-full border-2 border-slate-200 dark:border-slate-600 p-4 rounded-2xl bg-slate-50 dark:bg-slate-700 text-center font-bold outline-none focus:border-indigo-500 dark:text-white transition-colors" dir="ltr" />
                            <input name="p" type="password" placeholder="رمز عبور" className="w-full border-2 border-slate-200 dark:border-slate-600 p-4 rounded-2xl bg-slate-50 dark:bg-slate-700 text-center font-bold outline-none focus:border-indigo-500 dark:text-white transition-colors" dir="ltr" />
                            <button type="submit" className="w-full bg-indigo-600 text-white p-4 rounded-2xl font-black text-lg hover:bg-indigo-700 shadow-[0_8px_20px_rgba(79,70,229,0.3)] mt-6 transition-transform active:scale-[0.98]">ورود به سیستم</button>
                        </form>
                    </div>
                </div>
            );

            if (user.role === 'staff') return <StaffDashboard user={user} onLogout={()=>setUser(null)} />;

            return (
                <div className="min-h-screen flex flex-col bg-slate-100 dark:bg-slate-900 transition-colors duration-300">
                    <header className="bg-slate-900 text-white p-4 shadow-xl flex justify-between items-center z-40 sticky top-0 h-[72px] sm:h-[76px]">
                        <div className="flex items-center gap-6">
                            <h2 className="font-black text-xl flex items-center gap-2"><span className="text-indigo-400 bg-indigo-900/50 p-1.5 rounded-lg"><Icons.Tent /></span> <span className="hidden sm:block">ای‌ونت مستر</span></h2>
                            <nav className="hidden md:flex gap-1 bg-slate-800 p-1 rounded-xl">
                                <button onClick={() => {setView('EVENTS');}} className={`px-5 py-2.5 rounded-lg font-bold text-sm transition-all ${view === 'EVENTS' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-white hover:bg-slate-700'}`}>داشبورد رویدادها</button>
                                <button onClick={() => setView('MASTER')} className={`px-5 py-2.5 rounded-lg font-bold text-sm transition-all ${view === 'MASTER' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-white hover:bg-slate-700'}`}>مدیریت دیتابیس‌ها</button>
                            </nav>
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={toggleTheme} className="p-2 text-indigo-200 hover:text-white transition-colors focus:outline-none" title="تغییر پوسته">
                                {theme === 'light' ? <Icons.Moon /> : <Icons.Sun />}
                            </button>

                            <div className="relative group">
                                <button onClick={()=>setShowNotifPanel(!showNotifPanel)} className="relative p-2 text-indigo-200 hover:text-white transition-colors bg-slate-800 rounded-full border border-slate-700 focus:outline-none">
                                    <Icons.Bell />
                                    {notifs.length > 0 && <span className="absolute top-0 right-0 bg-red-500 border-2 border-slate-900 w-3.5 h-3.5 rounded-full animate-pulse"></span>}
                                </button>
                                {showNotifPanel && (
                                    <div className="absolute left-0 top-12 w-80 sm:w-[450px] bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-4 z-50 border border-slate-200 dark:border-slate-700 fade-in max-h-[80vh] overflow-y-auto custom-scroll text-slate-800 dark:text-slate-100">
                                        <div className="flex justify-between items-center mb-4 border-b dark:border-slate-700 pb-2">
                                            <h4 className="font-black">صندوق پیام‌ها و اعلانات</h4>
                                            <button onClick={()=>setShowNotifPanel(false)} className="text-slate-400 hover:text-red-500 font-bold">✕</button>
                                        </div>
                                        {notifs.length === 0 && <div className="text-sm text-slate-400 font-bold text-center py-4">پیام جدیدی ندارید</div>}
                                        {notifs.map(n => (
                                            <div key={n.id} className={`p-4 rounded-xl text-sm font-bold mb-3 border shadow-sm transition-all ${n.type==='delegation'?'bg-blue-50 dark:bg-blue-900/30 border-blue-200 dark:border-blue-800 text-blue-900 dark:text-blue-300':n.type==='issue'?'bg-red-50 dark:bg-red-900/30 border-red-200 dark:border-red-800 text-red-900 dark:text-red-300':'bg-slate-50 dark:bg-slate-700 border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200'}`}>
                                                <div className="flex gap-2 items-start leading-relaxed"><Icons.Alert/> <span>{toPersianNum(n.message)}</span></div>
                                                
                                                {n.type === 'delegation' && (
                                                    <div className="flex gap-2 mt-4 pt-3 border-t border-blue-200/50 dark:border-blue-700/50">
                                                        <button onClick={(e)=>{ e.stopPropagation(); resolveDelegation(n.ref_id, n.task_id, n.to_user_id, 'approved', n.id); }} className="flex-1 bg-green-500 text-white font-bold py-2 rounded-lg hover:bg-green-600 shadow-sm">تایید واگذاری</button>
                                                        <button onClick={(e)=>{ e.stopPropagation(); resolveDelegation(n.ref_id, n.task_id, n.to_user_id, 'rejected', n.id); }} className="flex-1 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-300 dark:border-slate-600 font-bold py-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700">رد درخواست</button>
                                                    </div>
                                                )}
                                                
                                                {n.type !== 'delegation' && (
                                                    <div className="mt-3 text-left"><button onClick={()=>markNotifRead(n.id)} className="text-xs font-bold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300">✓ متوجه شدم</button></div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                                {user.avatar ? <img src={user.avatar} className="w-7 h-7 rounded-full object-cover bg-white" alt="avatar"/> : <div className="w-7 h-7 rounded-full bg-slate-600 flex items-center justify-center text-xs"><Icons.Users/></div>}
                                <span className="text-sm font-bold text-slate-200 hidden sm:block">{toPersianNum(user.full_name)}</span>
                            </div>
                            <button onClick={() => setUser(null)} className="text-red-400 font-bold bg-red-400/10 px-4 py-2 rounded-lg hover:bg-red-500 hover:text-white transition-colors">خروج</button>
                        </div>
                    </header>
                    <div className="md:hidden flex bg-slate-800 p-2 gap-2 shadow-inner z-30 relative">
                        <button onClick={() => {setView('EVENTS');}} className={`flex-1 py-3 rounded-xl font-bold text-sm text-white transition-colors ${view === 'EVENTS' ? 'bg-indigo-600 shadow-inner' : 'bg-slate-700'}`}>رویدادها</button>
                        <button onClick={() => setView('MASTER')} className={`flex-1 py-3 rounded-xl font-bold text-sm text-white transition-colors ${view === 'MASTER' ? 'bg-indigo-600 shadow-inner' : 'bg-slate-700'}`}>دیتابیس‌ها</button>
                    </div>

                    <main className="flex-1 w-full max-w-[100rem] mx-auto relative z-0 p-4 md:p-8 pt-0">
                        {view === 'EVENTS' && <EventDashboard md={md} loadMd={loadMd} user={user} onNewEvent={()=>setShowCreate(true)} />}
                        {view === 'MASTER' && <div className="mt-8"><MasterData md={md} reload={loadMd} /></div>}
                        {showCreate && <EventCreate md={md} user={user} onDone={() => { setShowCreate(false); setView('MASTER'); setTimeout(()=>setView('EVENTS'), 50); }} onCancel={() => setShowCreate(false)} />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
