<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <title>ای‌ونت مستر | Enterprise ERP</title>
    <script src="assets/tailwind.js"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script src="assets/react.production.min.js"></script>
    <script src="assets/react-dom.production.min.js"></script>
    <script src="assets/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css');
        * { font-family: 'Vazirmatn', tahoma, sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-down { animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .pulse-text { animation: pulse 2s infinite; }
        @keyframes pulse { 0% {opacity: 0.5;} 50% {opacity: 1;} 100% {opacity: 0.5;} }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; } 
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #475569; }
        .crop-container { touch-action: none; user-select: none; }
        .gray-chain-locked { opacity: 0.5; filter: grayscale(100%); pointer-events: none; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased transition-colors duration-300">
    <div id="root"><div style="padding:40px; text-align:center;"><h2 style="color:#4f46e5; font-size:24px; font-weight:black;">در حال راه‌اندازی هسته سیستم یکپارچه...</h2></div></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Component } = React;
        const API_URL = 'api.php';

        const toPersianNum = (num) => { if (num === null || num === undefined) return ''; const farsiDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹']; return num.toString().replace(/\d/g, x => farsiDigits[x]); };
        function g2j(gy,gm,gd){var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];var gy2=(gm>2)?(gy+1):gy;var days=355666+(365*gy)+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)+gd+g_d_m[gm-1];var jy=-1595+33*~~(days/12053);days%=12053;jy+=4*~~(days/1461);days%=1461;if(days>365){jy+=~~((days-1)/365);days=(days-1)%365;}var jm=(days<186)?1+~~(days/31):7+~~((days-186)/30);var jd=1+((days<186)?(days%31):((days-186)%30));return[jy,jm,jd];}
        function j2g(jy,jm,jd){var gy,gm,gd,days;jy+=1595;days=-355668+(365*jy)+(~~(jy/33)*8)+~~(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);gy=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++;}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365;}gd=days+1;var sal_a=[0,31,((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];for(gm=0;gm<13&&gd>sal_a[gm];gm++)gd-=sal_a[gm];return[gy,gm,gd];}
        const toJalaliDate = (dateStr) => { if(!dateStr) return '---'; const d = new Date(dateStr); if(isNaN(d)) return dateStr; const [y, m, day] = g2j(d.getFullYear(), d.getMonth()+1, d.getDate()); const months = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند']; return toPersianNum(`${day} ${months[m-1]} ${y}`); };
        const toJalaliDateTime = (dateStr) => { if(!dateStr) return '---'; const d = new Date(dateStr); if(isNaN(d)) return dateStr; const [y, m, day] = g2j(d.getFullYear(), d.getMonth()+1, d.getDate()); const months = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند']; return toPersianNum(`${day} ${months[m-1]} ${y} - ساعت ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`); };
        const exportToCSV = (dataList, filename) => { const BOM = "\uFEFF"; if(!dataList || dataList.length === 0) return alert("داده‌ای برای خروجی وجود ندارد."); const header = Object.keys(dataList[0] || {}).join(",") + "\n"; const rows = dataList.map(obj => Object.values(obj).map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n"); const blob = new Blob([BOM + header + rows], { type: 'text/csv;charset=utf-8;' }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = filename + ".csv"; document.body.appendChild(link); link.click(); document.body.removeChild(link); };

        class AppErrorBoundary extends Component { constructor(props) { super(props); this.state = { hasError: false, error: null }; } static getDerivedStateFromError(error) { return { hasError: true, error: error }; } render() { if (this.state.hasError) return ( <div className="p-8 text-left text-red-600 bg-red-50 dark:bg-red-900/30 m-5 rounded-xl border border-red-200"><h3 className="font-bold text-xl mb-4">System Crash</h3><pre className="whitespace-pre-wrap">{this.state.error.toString()}</pre></div> ); return this.props.children; } }
        const safeFetch = async (action, body = null) => { try { const opt = body ? { method: 'POST', body: JSON.stringify(body) } : { method: 'GET' }; const req = await fetch(`${API_URL}?action=${action}`, opt); const res = await req.json(); if (res.error) { alert("پیام سیستم: " + res.error); return null; } return res; } catch (err) { alert("خطای ارتباط با سرور!"); return null; } };
        const Icons={Tent:()=>(<svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>),Up:()=>(<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>),Down:()=>(<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>),Top:()=>(<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6M4 4h16"/></svg>),Bottom:()=>(<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6M4 20h16"/></svg>),Check:()=>(<svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>),Building:()=>(<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4M8 6h.01"/></svg>),Users:()=>(<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>),Trash:()=>(<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>),Edit:()=>(<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>),Plus:()=>(<svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>),Clock:()=>(<svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>),Alert:()=>(<svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>),Dollar:()=>(<svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>),ArrowRight:()=>(<svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>),Activity:()=>(<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>),Link:()=>(<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>),Calendar:()=>(<svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>),Camera:()=>(<svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>),Move:()=>(<svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M9 19l3 3 3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>),Bell:()=>(<svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>),Moon:()=>(<svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>),Sun:()=>(<svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>),Download:()=>(<svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>)};

        const EventTimer = ({ start, end }) => {
            const [text, setText] = useState('در حال محاسبه...'); const [status, setStatus] = useState('upcoming'); 
            useEffect(() => {
                if(!start || !end) { setText('تاریخ رویداد ثبت نشده است'); return; }
                const calc = () => {
                    const now = new Date(); const s = new Date(start); const e = new Date(end);
                    if(now < s) {
                        const diff = s - now; const hours = diff / (1000 * 60 * 60);
                        if(hours > 48) { setText(`${toPersianNum(Math.floor(hours/24))} روز مانده تا شروع عملیات`); setStatus('upcoming'); } 
                        else { setText(`${toPersianNum(Math.floor(hours))} ساعت و ${toPersianNum(Math.floor((diff%(1000*60*60))/(1000*60)))} دقیقه تا شروع`); setStatus('near'); }
                    } else if (now >= s && now <= e) {
                        const diff = e - now; setText(`${toPersianNum(Math.floor(diff/(1000*60*60)))} ساعت و ${toPersianNum(Math.floor((diff%(1000*60*60))/(1000*60)))} دقیقه تا پایان`); setStatus('active');
                    } else { setText('خداقوت بابت همه زحماتتون 🎉'); setStatus('done'); }
                };
                calc(); const timer = setInterval(calc, 60000); return () => clearInterval(timer);
            }, [start, end]);
            const gradients = { upcoming: 'from-blue-600 to-indigo-600', near: 'from-amber-500 to-orange-500 pulse-text', active: 'from-red-500 to-pink-600 pulse-text', done: 'from-emerald-500 to-teal-500' };
            return ( <div className={`w-full bg-gradient-to-r ${gradients[status]} text-white text-center py-2.5 font-black text-sm md:text-base shadow-md relative z-50`}>{text}</div> );
        };

        const JalaliDatePicker = ({ value, onChange }) => {
            const [jY, setJY] = useState(1403); const [jM, setJM] = useState(1); const [jD, setJD] = useState(1); const [hour, setHour] = useState(0); const [min, setMin] = useState(0);
            useEffect(() => { if(value) { const d = new Date(value); if(!isNaN(d)) { const [y, m, day] = g2j(d.getFullYear(), d.getMonth()+1, d.getDate()); setJY(y); setJM(m); setJD(day); setHour(d.getHours()); setMin(d.getMinutes()); } } }, [value]);
            const triggerChange = (ny, nm, nd, nh, nmin) => { const [gy, gm, gd] = j2g(ny, nm, nd); const ds = `${gy}-${String(gm).padStart(2,'0')}-${String(gd).padStart(2,'0')}T${String(nh).padStart(2,'0')}:${String(nmin).padStart(2,'0')}`; onChange(ds); };
            const handleChange = (type, val) => { const v = parseInt(val); let y=jY, m=jM, d=jD, h=hour, mn=min; if(type==='y') { y=v; setJY(v); } if(type==='m') { m=v; setJM(v); } if(type==='d') { d=v; setJD(v); } if(type==='h') { h=v; setHour(v); } if(type==='mn') { mn=v; setMin(v); } triggerChange(y,m,d,h,mn); };
            const months = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
            return (
                <div className="flex flex-wrap gap-2 bg-white dark:bg-slate-800 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm" dir="ltr">
                    <select value={jY} onChange={e=>handleChange('y',e.target.value)} className="flex-1 min-w-[70px] border border-slate-200 dark:border-slate-600 p-2 rounded-lg bg-slate-50 dark:bg-slate-700 dark:text-white outline-none font-bold text-sm text-center cursor-pointer">{[...Array(10)].map((_,i)=><option key={i} value={1403+i}>{toPersianNum(1403+i)}</option>)}</select>
                    <select value={jM} onChange={e=>handleChange('m',e.target.value)} className="flex-1 min-w-[90px] border border-slate-200 dark:border-slate-600 p-2 rounded-lg bg-slate-50 dark:bg-slate-700 dark:text-white outline-none font-bold text-sm text-center cursor-pointer" dir="rtl">{months.map((m,i)=><option key={i} value={i+1}>{m}</option>)}</select>
                    <select value={jD} onChange={e=>handleChange('d',e.target.value)} className="flex-1 min-w-[60px] border border-slate-200 dark:border-slate-600 p-2 rounded-lg bg-slate-50 dark:bg-slate-700 dark:text-white outline-none font-bold text-sm text-center cursor-pointer">{[...Array(31)].map((_,i)=><option key={i} value={i+1}>{toPersianNum(i+1)}</option>)}</select>
                    <span className="font-bold text-slate-300 dark:text-slate-600 self-center hidden sm:inline">|</span>
                    <select value={hour} onChange={e=>handleChange('h',e.target.value)} className="w-16 border border-slate-200 dark:border-slate-600 p-2 rounded-lg bg-slate-50 dark:bg-slate-700 dark:text-white outline-none font-bold text-sm text-center cursor-pointer">{[...Array(24)].map((_,i)=><option key={i} value={i}>{toPersianNum(String(i).padStart(2,'0'))}</option>)}</select>
                    <span className="font-bold text-slate-800 dark:text-slate-300 self-center">:</span>
                    <select value={min} onChange={e=>handleChange('mn',e.target.value)} className="w-16 border border-slate-200 dark:border-slate-600 p-2 rounded-lg bg-slate-50 dark:bg-slate-700 dark:text-white outline-none font-bold text-sm text-center cursor-pointer">{[...Array(60)].map((_,i)=><option key={i} value={i}>{toPersianNum(String(i).padStart(2,'0'))}</option>)}</select>
                </div>
            );
        };

        function ImageCropper({ src, onComplete, onCancel, type = 'avatar' }) { const imageRef = useRef(null); const [crop, setCrop] = useState({ x: 0, y: 0, size: 150 }); const [dragging, setDragging] = useState(false); const [startPos, setStartPos] = useState({ x: 0, y: 0 }); const constrainCrop = (newX, newY, newSize, imgW, imgH) => { let s = Math.min(newSize, imgW, imgH); let x = Math.max(0, Math.min(newX, imgW - s)); let y = Math.max(0, Math.min(newY, imgH - s)); return { x, y, size: s }; }; const onImageLoad = (e) => { const { clientWidth, clientHeight } = e.target; const size = Math.min(clientWidth, clientHeight) * 0.7; setCrop(constrainCrop((clientWidth - size)/2, (clientHeight - size)/2, size, clientWidth, clientHeight)); }; const onDown = (e) => { e.preventDefault(); setDragging(true); const cX = e.touches ? e.touches[0].clientX : e.clientX; const cY = e.touches ? e.touches[0].clientY : e.clientY; setStartPos({ x: cX - crop.x, y: cY - crop.y }); }; const onMove = (e) => { if (!dragging || !imageRef.current) return; const cX = e.touches ? e.touches[0].clientX : e.clientX; const cY = e.touches ? e.touches[0].clientY : e.clientY; setCrop(constrainCrop(cX - startPos.x, cY - startPos.y, crop.size, imageRef.current.clientWidth, imageRef.current.clientHeight)); }; const onUp = () => setDragging(false); const changeSize = (delta) => { if(!imageRef.current) return; const center = { x: crop.x + crop.size/2, y: crop.y + crop.size/2 }; let newSize = Math.max(50, crop.size + delta); setCrop(constrainCrop(center.x - newSize/2, center.y - newSize/2, newSize, imageRef.current.clientWidth, imageRef.current.clientHeight)); }; const applyCrop = () => { if(!imageRef.current) return; const sX = imageRef.current.naturalWidth / imageRef.current.clientWidth; const sY = imageRef.current.naturalHeight / imageRef.current.clientHeight; const canvas = document.createElement('canvas'); canvas.width = 400; canvas.height = 400; const ctx = canvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 400, 400); ctx.drawImage( imageRef.current, crop.x * sX, crop.y * sY, crop.size * sX, crop.size * sY, 0, 0, 400, 400 ); onComplete(canvas.toDataURL('image/jpeg', 0.8)); }; return ( <div className="fixed inset-0 z-[100] bg-slate-900/90 flex flex-col items-center justify-center p-4 fade-in crop-container"> <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl w-full max-w-sm text-center flex flex-col"> <h3 className="font-black text-slate-800 dark:text-white mb-2">برش عکس</h3> <div className="relative mx-auto bg-slate-100 rounded-lg flex items-center justify-center" style={{ display:'inline-block', maxWidth: '100%', maxHeight: '300px' }} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp} onTouchMove={onMove} onTouchEnd={onUp}> <img ref={imageRef} src={src} onLoad={onImageLoad} className="block w-auto h-auto max-w-full max-h-[300px] pointer-events-none rounded-lg" crossOrigin="anonymous" /> <div className="absolute inset-0 pointer-events-none overflow-hidden rounded-lg"> <div className="absolute bg-black/60" style={{top: 0, left: 0, right: 0, height: crop.y}}></div> <div className="absolute bg-black/60" style={{top: crop.y, left: 0, width: crop.x, height: crop.size}}></div> <div className="absolute bg-black/60" style={{top: crop.y, right: 0, left: crop.x + crop.size, height: crop.size}}></div> <div className="absolute bg-black/60" style={{top: crop.y + crop.size, left: 0, right: 0, bottom: 0}}></div> <div className={`absolute border-[3px] border-white shadow-[0_0_0_1px_rgba(0,0,0,0.5),inset_0_0_10px_rgba(0,0,0,0.3)] cursor-move flex items-center justify-center text-white/50 ${type==='avatar'?'rounded-full':'rounded-xl'}`} style={{ left: crop.x, top: crop.y, width: crop.size, height: crop.size, pointerEvents: 'auto' }} onMouseDown={onDown} onTouchStart={onDown}> <Icons.Move /> </div> </div> </div> <div className="flex items-center justify-between mt-6 mb-6 gap-3"> <button onClick={()=>changeSize(-30)} className="bg-slate-100 dark:bg-slate-700 p-2.5 rounded-xl font-bold hover:bg-slate-200 dark:hover:bg-slate-600 text-sm flex-1">- کوچکتر</button> <button onClick={()=>changeSize(30)} className="bg-slate-100 dark:bg-slate-700 p-2.5 rounded-xl font-bold hover:bg-slate-200 dark:hover:bg-slate-600 text-sm flex-1">+ بزرگتر</button> </div> <div className="flex gap-3 mt-auto"> <button onClick={onCancel} className="flex-1 p-3.5 rounded-xl font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">انصراف</button> <button onClick={applyCrop} className="flex-1 p-3.5 rounded-xl font-bold bg-indigo-600 text-white">برش و ذخیره</button> </div> </div> </div> ); }

                            <span className="font-bold text-sm text-slate-700 dark:text-slate-300">محاسبه مالی:</span>

                                <label className="flex items-center gap-2 text-sm cursor-pointer dark:text-slate-200"><input type="radio" name="ct" checked={form.cost_type === 'cumulative'} onChange={() => setForm({...form, cost_type: 'cumulative'})} className="accent-indigo-600 w-4 h-4"/> تجمیعی (ثابت)</label>
                                <label className="flex items-center gap-2 text-sm cursor-pointer dark:text-slate-200"><input type="radio" name="ct" checked={form.cost_type === 'individual'} onChange={() => setForm({...form, cost_type: 'individual'})} className="accent-indigo-600 w-4 h-4"/> انفرادی (نفری)</label>
                            </div>
                        </div>
                    </div>

                    <div className="bg-indigo-50/50 dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-indigo-100 dark:border-slate-700 shadow-sm">
                        <h4 className="font-bold mb-4 text-indigo-900 dark:text-indigo-300 flex items-center gap-2"><Icons.Plus/> پکیج‌ساز</h4>
                        <div className="grid sm:grid-cols-2 gap-3 mb-4">
                            <input type="text" placeholder="نام پکیج (مثال: فول آپشن)" value={pkgName} onChange={(e) => setPkgName(e.target.value)} className="w-full border-2 dark:border-slate-600 p-2.5 rounded-xl text-sm outline-none font-bold dark:bg-slate-700 dark:text-white" />
                            <input type="number" placeholder="قیمت واحد (خالی = TBD)" value={pkgPrice} onChange={(e) => setPkgPrice(e.target.value)} className="w-full border-2 dark:border-slate-600 p-2.5 rounded-xl text-sm outline-none dark:bg-slate-700 dark:text-white" dir="ltr" />
                        </div>
                        <div className="bg-white dark:bg-slate-700 p-4 rounded-xl border border-slate-200 dark:border-slate-600">
                            <p className="text-xs font-bold mb-3 text-slate-500 dark:text-slate-300">میکروتسک‌های اختصاصی این پکیج:</p>
                            <div className="space-y-2 mb-4">
                                {pkgTasks.map((t, i) => {
                                    let displayRole = t.role; let depDisplay = null;
                                    if(t.role.includes('|dep:')) { const parts = t.role.split('|dep:'); displayRole = parts[0]; depDisplay = parts[1]; }
                                    return (
                                        <div key={i} className="text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 p-2.5 rounded-lg flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                                            <div className="flex flex-col">
                                                <span className="font-bold text-slate-700 dark:text-slate-200 leading-relaxed text-[13px] break-words">{toPersianNum(t.title)}</span>
                                                {depDisplay && <span className="text-[10px] text-amber-600 mt-1">🔗 نیازمند: {toPersianNum(depDisplay)}</span>}
                                            </div>
                                            <div className="flex flex-wrap items-center gap-1.5 shrink-0">
                                                {t.timing && <span className="text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-slate-700 px-2 py-1 rounded-md border border-amber-200 dark:border-slate-600 font-bold whitespace-nowrap text-[10px]"><Icons.Clock/> {t.timing}</span>}
                                                <span className="text-indigo-700 dark:text-indigo-300 bg-indigo-50 dark:bg-slate-700 px-2 py-1 rounded-md border border-indigo-200 dark:border-slate-600 font-bold whitespace-nowrap text-[10px]">@{toPersianNum(displayRole)}</span>
                                                <div className="flex gap-1 border-r border-slate-300 dark:border-slate-600 pr-1.5 ml-1">
                                                    <button onClick={() => editTask(i)} className="text-blue-500 hover:text-blue-700 p-1 bg-white dark:bg-slate-800 rounded shadow-sm"><Icons.Edit/></button>
                                                    <button onClick={() => setPkgTasks(pkgTasks.filter((_,idx)=>idx!==i))} className="text-red-500 hover:text-red-700 p-1 bg-white dark:bg-slate-800 rounded shadow-sm"><Icons.Trash/></button>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                            <div className="flex flex-col gap-3 bg-slate-50 dark:bg-slate-800 p-3 rounded-xl border border-dashed border-slate-300 dark:border-slate-600">
                                <input type="text" placeholder="عنوان کار (مثال: تنظیم نور)" value={taskTitle} onChange={(e) => setTaskTitle(e.target.value)} className="w-full border dark:border-slate-600 p-2.5 rounded-lg text-sm outline-none focus:border-indigo-400 dark:bg-slate-700 dark:text-white" />
                                <div className="grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-2">
                                    <input type="text" placeholder="نقش (@تکنسین)" value={taskRole} onChange={(e) => setTaskRole(e.target.value)} className="w-full border dark:border-slate-600 p-2.5 rounded-lg text-sm outline-none focus:border-indigo-400 dark:bg-slate-700 dark:text-white" />
                                    <select value={taskTiming} onChange={(e) => setTaskTiming(e.target.value)} className="w-full border dark:border-slate-600 p-2.5 rounded-lg text-sm outline-none focus:border-indigo-400 bg-white dark:bg-slate-700 dark:text-white font-bold">
                                        <option value="پیش‌تولید">پیش‌تولید</option><option value="روز قبل از رویداد">روز قبل از رویداد</option><option value="روز رویداد">روز رویداد</option><option value="پایان رویداد">پایان رویداد</option><option value="پس‌تولید">پس‌تولید</option>
                                    </select>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-2">
                                    <select value={dependsOn} onChange={e=>setDependsOn(e.target.value)} className="w-full border dark:border-slate-600 p-2.5 rounded-lg text-sm outline-none bg-white dark:bg-slate-700 dark:text-white">
                                        <option value="">(زنجیر خاکستری: بدون پیش‌نیاز)</option>
                                        {pkgTasks.map((t, idx) => <option key={idx} value={t.title}>پیش‌نیاز: {t.title}</option>)}
                                    </select>
                                    <button onClick={addTaskToPackage} className="w-full sm:w-auto bg-slate-800 dark:bg-indigo-600 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm hover:bg-slate-700">افزودن تسک</button>
                                </div>
                            </div>
                        </div>
                        <button onClick={addPackage} className="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold text-sm mt-4 hover:bg-indigo-700 shadow-md transition-colors">ثبت پکیج در لیست پایین</button>
                    </div>

                    {packages.length > 0 && (
                        <div className="bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200 dark:border-slate-700">
                            <h4 className="font-bold mb-4 text-slate-700 dark:text-slate-300">پکیج‌های آماده‌شده:</h4>
                            {packages.map((p, i) => (
                                <div key={i} className="bg-slate-50 dark:bg-slate-700 p-4 rounded-xl border border-slate-200 dark:border-slate-600 mb-3 hover:border-indigo-200 transition-colors">
                                    <div className="flex flex-col sm:flex-row justify-between sm:items-start gap-4 mb-3 border-b border-slate-200 dark:border-slate-600 pb-3">
                                        <div className="font-bold text-slate-800 dark:text-slate-100 leading-relaxed">
                                            {toPersianNum(p.name)} 
                                            <span className="block sm:inline-block text-xs font-normal text-slate-500 dark:text-slate-300 bg-white dark:bg-slate-800 px-2 py-1 rounded-md border dark:border-slate-600 sm:mr-2 shadow-sm mt-2 sm:mt-0 w-fit">قیمت واحد: {p.price ? toPersianNum(Number(p.price).toLocaleString()) + ' ت' : 'TBD'}</span>
                                        </div>
                                        <div className="flex gap-2 shrink-0 self-end sm:self-auto">
                                            <button onClick={() => editPackage(i)} className="text-blue-500 hover:text-white hover:bg-blue-500 bg-white dark:bg-slate-800 p-2 rounded-lg border dark:border-slate-600 shadow-sm transition-colors"><Icons.Edit/></button>
                                            <button onClick={() => setPackages(packages.filter((_,idx) => idx !== i))} className="text-red-500 hover:text-white hover:bg-red-500 bg-white dark:bg-slate-800 p-2 rounded-lg border dark:border-slate-600 shadow-sm transition-colors"><Icons.Trash/></button>
                                        </div>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {p.tasks.map((t, idx) => {
                                            let displayRole = t.role;
                                            if(t.role.includes('|dep:')) displayRole = t.role.split('|dep:')[0];
                                            return (
                                                <span key={idx} className={`text-xs border px-2.5 py-1.5 rounded-lg flex items-center gap-2 shadow-sm break-words max-w-full ${t.role.includes('|dep:') ? 'bg-amber-50 border-amber-200 text-amber-800 dark:bg-amber-900/30' : 'bg-white border-slate-200 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}`}>
                                                    <span className="truncate">{toPersianNum(t.title)}</span> <b className="text-indigo-600 dark:text-indigo-400 shrink-0">@{toPersianNum(displayRole)}</b>
                                                    {t.role.includes('|dep:') && <Icons.Link/>}
                                                </span>
                                            )
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    <button onClick={submit} className={`w-full text-white py-4 rounded-xl font-bold text-lg shadow-md transition-transform active:scale-95 ${editItem ? 'bg-blue-600' : 'bg-green-600'}`}>{editItem ? 'ذخیره تغییرات سرویس' : 'ثبت نهایی سرویس'}</button>
                </div>
            );
        }

        // =====================================
        // تب اصلی مدیریت دیتابیس‌ها
        // =====================================
        function MasterData({ md, reload }) {
            const [tab, setTab] = useState('categories'); const [catName, setCatName] = useState(''); const [editItem, setEditItem] = useState(null);
            useEffect(() => { setEditItem(null); setCatName(''); }, [tab]);

            const saveItem = async (type, data, editId = null) => { if(editId) { await safeFetch('edit_master_item', { type, id: editId, ...data }); setEditItem(null); } else { await safeFetch('add_master_item', { type, ...data }); } reload(); };
            const saveCategory = async () => { if(!catName) return; if(editItem) { await safeFetch('edit_master_item', { type: 'category', id: editItem.id, name: catName }); setEditItem(null); } else { await safeFetch('add_master_item', { type: 'category', name: catName }); } setCatName(''); reload(); };
            const deleteItem = async (type, id) => { if(window.confirm("آیا از حذف این آیتم مطمئن هستید؟")) { await safeFetch('delete_master_item', { type, id }); if(editItem && editItem.id === id) setEditItem(null); reload(); } };

            const currentList = tab === 'staff' ? (md.staff || []) : tab === 'orgs' ? (md.organizations || []) : tab === 'venues' ? (md.venues || []) : tab === 'services' ? (md.services || []) : (md.categories || []);

            return (
                <div className="fade-in max-w-6xl mx-auto pb-20">
                    <div className="flex overflow-x-auto gap-2 mb-8 bg-white dark:bg-slate-800 p-2 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 custom-scroll">
                        {[{id: 'categories', label: 'دسته‌بندی‌ها', tbl: 'categories', typeStr: 'category'}, {id: 'services', label: 'خدمات', tbl: 'services', typeStr: 'service'}, {id: 'venues', label: 'مکان‌ها', tbl: 'venues', typeStr: 'venue'}, {id: 'orgs', label: 'سازمان‌ها', tbl: 'organizations', typeStr: 'org'}, {id: 'staff', label: 'همکاران', tbl: 'users', typeStr: 'staff'}].map((t) => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`whitespace-nowrap px-6 py-3 rounded-xl font-bold text-sm transition-all ${tab === t.id ? 'bg-slate-800 dark:bg-indigo-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>{t.label}</button>
                        ))}
                    </div>
                    <div className="grid lg:grid-cols-12 gap-8">
                        <div className="lg:col-span-5 bg-white dark:bg-slate-800 p-5 md:p-8 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 h-fit lg:sticky lg:top-24 max-h-none lg:max-h-[85vh] lg:overflow-y-auto custom-scroll">
                            <div className="flex justify-between items-center mb-6 border-b dark:border-slate-700 pb-4">
                                <h4 className={`font-black text-xl ${editItem ? 'text-blue-600' : 'text-indigo-900 dark:text-indigo-300'}`}>{editItem ? 'ویرایش آیتم' : 'افزودن آیتم جدید'}</h4>
                                {editItem && <button onClick={()=>{setEditItem(null); setCatName('');}} className="text-xs bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-3 py-1.5 rounded-lg hover:bg-slate-200 font-bold border border-slate-300 dark:border-slate-600 transition-colors">انصراف</button>}
                            </div>
                            {tab === 'categories' && ( <div className="space-y-4"> <input type="text" placeholder="نام دسته‌بندی *" value={catName} onChange={(e) => setCatName(e.target.value)} className="w-full border-2 dark:border-slate-600 p-4 rounded-xl outline-none focus:border-indigo-500 font-bold dark:bg-slate-700 dark:text-white" /> <button onClick={saveCategory} className={`w-full text-white p-4 rounded-xl font-bold shadow-md transition-colors ${editItem ? 'bg-blue-600 hover:bg-blue-700' : 'bg-green-600 hover:bg-green-700'}`}>{editItem ? 'ذخیره تغییرات' : 'ثبت دسته‌بندی'}</button> </div> )}
                            {tab === 'staff' && <StaffForm onSave={saveItem} mdStaff={md.staff || []} editItem={editItem} />}
                            {tab === 'orgs' && <OrgForm onSave={saveItem} editItem={editItem} />}
                            {tab === 'venues' && <VenueForm onSave={saveItem} editItem={editItem} />}
                            {tab === 'services' && <ServiceForm onSave={saveItem} categories={md.categories || []} editItem={editItem} />}
                        </div>
                        <div className="lg:col-span-7">
                            <h4 className="font-black text-2xl text-slate-800 dark:text-white mb-2">لیست دیتابیس</h4>
                            <p className="text-sm text-slate-500 dark:text-slate-400 font-bold mb-6">آیتم‌هایی که در بالای لیست قرار دارند، در جلسات پرزنت در اولویت نمایش هستند.</p>
                            <div className="space-y-3 mt-6">
                                {currentList.length === 0 && <p className="text-center text-slate-400 font-bold py-6">لیست خالی است.</p>}
                                {currentList.map((item, idx) => {
                                    const typeStr = tab === 'orgs' ? 'org' : tab === 'venues' ? 'venue' : tab === 'services' ? 'service' : tab === 'staff' ? 'staff' : 'category';
                                    const table = tab === 'orgs' ? 'organizations' : tab === 'staff' ? 'users' : tab;
                                    return (
                                        <div key={item.id} className={`flex flex-col sm:flex-row justify-between sm:items-center gap-4 p-4 border rounded-2xl shadow-sm transition-all ${editItem && editItem.id === item.id ? 'bg-blue-50 dark:bg-blue-900/30 border-blue-300 ring-2 ring-blue-100' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:shadow-md'}`}>
                                            <div className="flex items-center gap-4 w-full sm:w-auto overflow-hidden">
                                                <div className="w-8 h-8 shrink-0 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-400 dark:text-slate-300 flex items-center justify-center font-bold text-xs">{toPersianNum(idx + 1)}</div>
                                                {item.avatar && <img src={item.avatar} className="w-12 h-12 rounded-full object-cover shadow-sm border border-slate-200 shrink-0 bg-white" />}
                                                {item.logo && <img src={item.logo} className="w-12 h-12 rounded-xl object-cover shadow-sm border border-slate-200 shrink-0 bg-white" />}
                                                <div className="min-w-0">
                                                    <div className="font-bold text-slate-800 dark:text-slate-100 truncate">{toPersianNum(item.name || item.full_name)} {item.is_shadow ? <span className="text-xs font-normal bg-slate-200 dark:bg-slate-700 px-2 rounded-full text-slate-600 dark:text-slate-300 ml-1">تلفنی</span> : ''} {item.can_delegate===1 && <span className="text-xs text-blue-600 dark:text-blue-300 bg-blue-50 dark:bg-blue-900/50 px-2 rounded border border-blue-200 dark:border-blue-800 ml-1">مجوز واگذاری</span>}</div>
                                                    <div className="text-xs text-slate-500 dark:text-slate-400 mt-1 truncate">{item.capacity ? `ظرفیت: ${toPersianNum(item.capacity)}` : item.phone ? `تلفن: ${toPersianNum(item.phone)}` : ''}</div>
                                                </div>
                                            </div>
                                            <div className="flex items-center justify-between sm:justify-end gap-3 w-full sm:w-auto mt-2 sm:mt-0 pt-3 sm:pt-0 border-t sm:border-0 border-slate-100 dark:border-slate-700">
                                                <div className="flex gap-1 shrink-0">
                                                    <button onClick={() => deleteItem(typeStr, item.id)} className="p-2 text-red-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition-colors" title="حذف"><Icons.Trash /></button>
                                                    <button onClick={() => { setEditItem(item); if(typeStr==='category') setCatName(item.name); window.scrollTo({top:0, behavior:'smooth'}); }} className="p-2 text-blue-500 hover:text-blue-700 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition-colors bg-slate-50 dark:bg-slate-700 sm:bg-transparent border sm:border-transparent border-slate-200" title="ویرایش"><Icons.Edit /></button>
                                                </div>
                                                <SortControls table={table} id={item.id} onSort={reload} />
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
// --- پایان بخش اول ---
// --- شروع بخش دوم ---
        // =====================================
        // داشبورد امنیتی کارمندان (Strict RBAC)
        // =====================================
        function StaffDashboard({ user, onLogout }) {
            const [myTasks, setMyTasks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [delegationModal, setDelegationModal] = useState(null);
            const [staffList, setStaffList] = useState([]);
            const [notifs, setNotifs] = useState([]);
            const [showNotifPanel, setShowNotifPanel] = useState(false);

            const loadTasks = async () => {
                const evs = await safeFetch('get_events');
                let allMyTasks = [];
                if(evs) {
                    for(let ev of evs) {
                        const d = await safeFetch(`get_event_detail&id=${ev.id}`);
                        if(d && d.tasks) {
                            const userTasks = d.tasks.filter(t => t.assignee_id == user.id);
                            if(userTasks.length > 0) allMyTasks.push({ event: ev, tasks: d.tasks }); // واکشی کل تسک‌ها برای بررسی قفل‌های زنجیر خاکستری
                        }
                    }
                }
                setMyTasks(allMyTasks);
                setLoading(false);
            };

            const loadStaff = async () => { const md = await safeFetch('get_master_data'); if(md && md.staff) setStaffList(md.staff); };
            const fetchNotifs = async () => { const res = await safeFetch(`get_notifications&user_id=${user.id}`); if(res) setNotifs(res); };

            useEffect(() => { 
                loadTasks(); fetchNotifs();
                if(user.can_delegate === 1) loadStaff(); 
                const intv = setInterval(fetchNotifs, 15000);
                return () => clearInterval(intv);
            }, []);

            const toggleTask = async (task, currentDone, eventId) => { 
                if(task.role_tag && task.role_tag.includes('|dep:')) {
                    const parentTitle = task.role_tag.split('|dep:')[1];
                    const parentIsDone = myTasks.flatMap(g=>g.tasks).find(t=>t.title === parentTitle)?.is_done;
                    if(parentIsDone === 0) return alert("این تسک قفل است و باید منتظر انجام پیش‌نیاز آن باشید!");
                }
                await safeFetch('update_task', {task_id: task.id, event_id: eventId, is_done: !currentDone, task_title: task.title, user_name: user.full_name}); 
                loadTasks(); 
            };
            
            const reportIssue = async (taskId, eventId, title, hasIssue) => { if(hasIssue) { await safeFetch('update_task', {task_id: taskId, event_id: eventId, has_issue: false, task_title: title, user_name: user.full_name}); } else { const msg = prompt("لطفا مشکل را بنویسید:"); if(msg) await safeFetch('update_task', {task_id: taskId, event_id: eventId, has_issue: true, issue_note: msg, task_title: title, user_name: user.full_name}); } loadTasks(); };
            
            const requestDelegation = async (toUserId) => {
                if(!toUserId) return alert("یک همکار انتخاب کنید");
                await safeFetch('request_delegation', { task_id: delegationModal.task_id, event_id: delegationModal.event_id, from_user_id: user.id, to_user_id: toUserId, from_name: user.full_name });
                alert("درخواست واگذاری در صندوق پیام‌های مدیریت قرار گرفت.");
                setDelegationModal(null);
            };

            const markNotifRead = async (id) => { await safeFetch('mark_notif_read', {id}); fetchNotifs(); loadTasks(); };

            return (
                <div className="min-h-screen flex flex-col bg-slate-100 dark:bg-slate-900 pb-20 transition-colors duration-300">
                    <header className="bg-indigo-900 dark:bg-slate-950 text-white p-4 shadow-lg flex justify-between items-center z-10 sticky top-0">
                        <div className="flex items-center gap-4">
                            {user.avatar ? <img src={user.avatar} className="w-10 h-10 rounded-full border-2 border-indigo-400 object-cover bg-white"/> : <div className="w-10 h-10 rounded-full bg-indigo-800 flex items-center justify-center"><Icons.Users/></div>}
                            <div>
                                <h2 className="font-black text-lg">سلام، {toPersianNum(user.full_name)}</h2>
                                <p className="text-xs text-indigo-300 font-bold">داشبورد اختصاصی وظایف</p>
                            </div>
                        </div>
                        <div className="flex gap-4 items-center">
                            <div className="relative group">
                                <button onClick={()=>setShowNotifPanel(!showNotifPanel)} className="relative p-2 text-indigo-200 hover:text-white transition-colors focus:outline-none">
                                    <Icons.Bell />
                                    {notifs.length > 0 && <span className="absolute top-0 right-0 bg-red-500 border-2 border-indigo-900 w-3.5 h-3.5 rounded-full animate-pulse"></span>}
                                </button>
                                {showNotifPanel && (
                                    <div className="absolute left-auto right-0 md:left-0 md:right-auto top-12 w-80 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-4 z-50 border border-slate-200 dark:border-slate-700 fade-in max-h-96 overflow-y-auto custom-scroll text-slate-800 dark:text-slate-100">
                                        <h4 className="font-black mb-4 border-b dark:border-slate-700 pb-2">اعلانات سیستم</h4>
                                        {notifs.length === 0 && <div className="text-sm text-slate-400 font-bold text-center py-4">پیام جدیدی ندارید</div>}
                                        {notifs.map(n => (
                                            <div key={n.id} onClick={()=>{markNotifRead(n.id); setShowNotifPanel(false);}} className={`p-4 rounded-xl text-sm font-bold mb-2 cursor-pointer border hover:shadow-md transition-all ${n.type==='error'?'bg-red-50 border-red-200 text-red-800':n.type==='success'?'bg-green-50 border-green-200 text-green-800':'bg-slate-50 dark:bg-slate-700 border-slate-200 dark:border-slate-600'}`}>
                                                <div className="flex gap-2 items-start leading-relaxed"><Icons.Alert/> <span>{toPersianNum(n.message)}</span></div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <button onClick={onLogout} className="text-white bg-white/10 px-4 py-2 rounded-xl font-bold text-sm hover:bg-white/20 transition-colors">خروج</button>
                        </div>
                    </header>

                    <main className="flex-1 p-4 w-full max-w-4xl mx-auto mt-4">
                        {loading ? <div className="text-center py-20 pulse-text font-black text-indigo-300 text-xl">در حال دریافت وظایف...</div> : (
                            <div className="space-y-6 fade-in">
                                {myTasks.length === 0 && <div className="text-center py-20 bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 font-black text-slate-400 shadow-sm">هیچ وظیفه‌ای برای شما در جریان نیست.</div>}
                                
                                {myTasks.map((group, idx) => {
                                    const myActualTasks = group.tasks.filter(t => t.assignee_id == user.id);
                                    if(myActualTasks.length === 0) return null;

                                    return (
                                    <div key={idx} className="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden relative">
                                        <div className="bg-slate-800 dark:bg-slate-950 p-5 sm:p-6 text-white relative">
                                            {group.event.org_logo && <img src={group.event.org_logo} className="absolute left-4 top-4 w-16 h-16 opacity-20 pointer-events-none" />}
                                            <div className="text-xs font-bold text-indigo-300 mb-1">پرونده: {toPersianNum(group.event.id)}</div>
                                            <h3 className="font-black text-2xl mb-2">{toPersianNum(group.event.title)}</h3>
                                            <div className="text-sm text-slate-300 mt-3 flex flex-col sm:flex-row gap-3">
                                                <span className="flex items-center gap-1.5"><Icons.Building/> {toPersianNum(group.event.venue_name) || 'بدون سالن'}</span>
                                                <span className="font-bold flex items-center gap-1.5 bg-slate-700/50 px-3 py-1.5 rounded-lg w-fit" dir="ltr"><Icons.Calendar/> {toJalaliDate(group.event.start_date)}</span>
                                            </div>
                                        </div>
                                        <div className="p-4 sm:p-6 space-y-4 bg-slate-50 dark:bg-slate-800">
                                            {myActualTasks.map(t => {
                                                let isLocked = false;
                                                let depTitle = '';
                                                let pureRole = t.role_tag;
                                                if(t.role_tag && t.role_tag.includes('|dep:')) {
                                                    const parts = t.role_tag.split('|dep:');
                                                    pureRole = parts[0];
                                                    depTitle = parts[1];
                                                    const parentTask = group.tasks.find(x => x.title === depTitle);
                                                    if(parentTask && parentTask.is_done === 0) isLocked = true;
                                                }

                                                return (
                                                <div key={t.id} className={`p-5 rounded-2xl border-2 transition-all shadow-sm ${isLocked ? 'gray-chain-locked bg-slate-200 border-dashed border-slate-300' : t.has_issue ? 'bg-red-50 border-red-300' : t.is_done ? 'bg-green-50 border-green-200 opacity-70' : 'bg-white dark:bg-slate-700 border-slate-200 dark:border-slate-600'}`}>
                                                    <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                                                        <div className="flex-1">
                                                            <div className={`font-bold text-lg mb-3 leading-relaxed ${t.is_done ? 'line-through text-slate-400' : 'text-slate-800 dark:text-white'}`}>{toPersianNum(t.title)}</div>
                                                            <div className="flex flex-wrap gap-2">
                                                                <span className="inline-flex items-center gap-1 bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700/50 text-amber-700 dark:text-amber-400 text-xs font-bold px-2.5 py-1 rounded-md shadow-sm"><Icons.Clock/> {t.timing_tag}</span>
                                                                <span className="inline-block bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 text-xs font-bold px-2.5 py-1 rounded-md border border-indigo-200 dark:border-indigo-700/50 shadow-sm">@{toPersianNum(pureRole)}</span>
                                                            </div>
                                                            {isLocked && <div className="text-xs font-bold text-slate-500 dark:text-slate-400 bg-white dark:bg-slate-800 p-2 rounded-lg mt-3 border border-slate-300 dark:border-slate-600 shadow-sm">⏳ در انتظار انجام: {toPersianNum(depTitle)}</div>}
                                                            {t.has_issue && <div className="text-xs text-red-600 font-bold bg-red-100 p-2.5 rounded-lg mt-3 border border-red-200">مانع: {toPersianNum(t.issue_note)}</div>}
                                                        </div>
                                                        <div className="flex items-stretch sm:items-center gap-2 shrink-0 border-t sm:border-0 border-slate-200 dark:border-slate-600 pt-3 sm:pt-0">
                                                            {user.can_delegate === 1 && !t.is_done && !isLocked && (
                                                                <button onClick={()=>setDelegationModal({task_id: t.id, event_id: group.event.id})} className="px-4 py-3 sm:py-2.5 rounded-xl border-2 border-blue-200 bg-blue-50 text-blue-700 font-bold text-sm hover:bg-blue-100 transition-colors shadow-sm">واگذاری وظیفه</button>
                                                            )}
                                                            <button disabled={isLocked} onClick={()=>reportIssue(t.id, group.event.id, t.title, t.has_issue)} className={`px-4 py-3 sm:py-2.5 rounded-xl border-2 font-bold text-sm transition-colors shadow-sm ${t.has_issue ? 'bg-green-50 text-green-700 border-green-300 hover:bg-green-100' : 'bg-red-50 text-red-600 border-red-200 hover:bg-red-100'}`}>{t.has_issue ? 'رفع توقف' : 'گزارش مشکل'}</button>
                                                            <button disabled={isLocked} onClick={()=>toggleTask(t, t.is_done, group.event.id)} className={`w-14 h-14 sm:w-12 sm:h-12 rounded-xl border-2 flex items-center justify-center transition-colors shadow-sm ${t.is_done ? 'bg-green-500 border-green-600 text-white' : 'bg-indigo-50 dark:bg-indigo-900/30 border-indigo-200 dark:border-indigo-700 text-indigo-500 dark:text-indigo-400 hover:bg-indigo-600 hover:text-white dark:hover:bg-indigo-600 dark:hover:text-white'}`}><Icons.Check/></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            )})}
                                        </div>
                                    </div>
                                )})}
                            </div>
                        )}
                    </main>

                    {delegationModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                            <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl">
                                <h3 className="text-xl font-black text-slate-800 dark:text-white mb-2">درخواست واگذاری وظیفه</h3>
                                <p className="text-sm font-bold text-slate-500 dark:text-slate-400 mb-6 leading-relaxed">پس از ثبت درخواست، مدیریت باید این انتقال را تایید کند.</p>
                                <select id="delegateTo" className="w-full border-2 border-slate-200 dark:border-slate-700 p-4 rounded-xl font-bold outline-none focus:border-indigo-500 mb-8 bg-slate-50 dark:bg-slate-700 dark:text-white cursor-pointer">
                                    <option value="">(انتخاب همکار جایگزین)</option>
                                    {staffList.filter(s => s.id !== user.id).map(s => <option key={s.id} value={s.id}>{toPersianNum(s.full_name)}</option>)}
                                </select>
                                <div className="flex gap-3">
                                    <button onClick={()=>setDelegationModal(null)} className="flex-1 py-4 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-white font-bold rounded-xl hover:bg-slate-200 transition-colors">انصراف</button>
                                    <button onClick={()=>requestDelegation(document.getElementById('delegateTo').value)} className="flex-1 py-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-700 transition-colors">ارسال درخواست</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // =====================================
        // داشبورد اتاق فرمان رویداد
        // =====================================
        function EventDetail({ eventId, onBack, user, md }) {
            const [data, setData] = useState(null);
            const [staff, setStaff] = useState([]);
            const [activePhase, setActivePhase] = useState(''); 
            const [editModal, setEditModal] = useState(false);
            const [editForm, setEditForm] = useState({});
            const [tab, setTab] = useState('operations'); 

            const loadData = async () => {
                const res = await safeFetch(`get_event_detail&id=${eventId}`);
                if(res) {
                    setData(res);
                    const now = new Date();
                    const st = new Date(res.event.start_date);
                    const en = new Date(res.event.end_date);
                    let detectedPhase = 'پیش‌تولید';
                    if (now >= st && now <= en) detectedPhase = 'روز رویداد';
                    else if (now > en) detectedPhase = 'پایان رویداد';
                    else if (st - now < 24*60*60*1000 && st - now > 0) detectedPhase = 'روز قبل از رویداد';
                    
                    if(!activePhase) setActivePhase(detectedPhase);
                }
                const mdRes = await safeFetch('get_master_data');
                if(mdRes) setStaff(mdRes.staff || []);
            };
            useEffect(() => { loadData(); }, []);

            const apiCall = async (action, body) => { 
                const res = await safeFetch(action, { ...body, event_id: eventId, user_name: user.full_name }); 
                if(res) loadData(); 
            };

            if(!data) return <div className="flex h-64 items-center justify-center pulse-text font-black text-indigo-300 text-xl">اتاق فرمان در حال بارگذاری است...</div>;

            const ev = data.event;
            const tasks = data.tasks || [];
            const logs = data.logs || [];
            const services = data.services || [];
            const delegations = data.delegations || [];
            
            const subTotal = services.reduce((acc, curr) => acc + (Number(curr.frozen_price) || 0), 0);
            const discount = Number(ev.discount) || 0;
            const taxPercent = Number(ev.tax_percent) || 0;
            const taxAmount = ((subTotal - discount) * taxPercent) / 100;
            const total = subTotal - discount + taxAmount;
            const deposit = Number(ev.deposit) || 0;
            const remaining = total - deposit;

            const kanbanCols = ['پیش‌تولید', 'روز قبل از رویداد', 'روز رویداد', 'پایان رویداد', 'پس‌تولید'];
            const tasksByTiming = {};
            kanbanCols.forEach(c => tasksByTiming[c] = tasks.filter(t => t.timing_tag === c));
            const noTimingTasks = tasks.filter(t => !kanbanCols.includes(t.timing_tag));
            if(noTimingTasks.length > 0) { kanbanCols.push('سایر زمان‌ها'); tasksByTiming['سایر زمان‌ها'] = noTimingTasks; }

            const rolesNeeded = Array.from(new Set(tasks.map(t => {
                if(t.role_tag && t.role_tag.includes('|dep:')) return t.role_tag.split('|dep:')[0];
                return t.role_tag;
            }).filter(Boolean)));

            const handleQuickReplace = (oldUserId, newUserId) => {
                if(!oldUserId || !newUserId) return;
                if(window.confirm("آیا از انتقال تمام وظایف این شخص مطمئن هستید؟")) {
                    apiCall('quick_replace', { old_user_id: oldUserId, new_user_id: newUserId });
                }
            };

            const copyClientLink = () => {
                const link = `https://asvashop.com/event/client_portal?token=evt_${eventId}_${Math.random().toString(36).substr(2,9)}`;
                prompt("لینک پورتال کارفرما ساخته شد. آن را کپی کرده و برای مشتری ارسال کنید:", link);
            };

            const openEditModal = () => {
                setEditForm({ venue_id: ev.venue_id, guest_count: ev.guest_count, start_date: ev.start_date ? ev.start_date.slice(0,16) : '', end_date: ev.end_date ? ev.end_date.slice(0,16) : '' });
                setEditModal(true);
            };

            const saveEditEvent = async () => {
                await apiCall('update_event_details', editForm);
                setEditModal(false);
            };

            const resolveDelegation = async (delId, taskId, toUserId, status) => {
                await apiCall('resolve_delegation', { delegation_id: delId, task_id: taskId, to_user_id: toUserId, status: status, from_user_id: delegations.find(d=>d.id==delId).from_user_id });
            };

            return (
                <div className="fade-in max-w-[90rem] mx-auto pb-24">
                    <div className="fixed top-[72px] sm:top-[76px] left-0 right-0 z-30"><EventTimer start={ev.start_date} end={ev.end_date} /></div>
                    <div className="mt-16"></div>

                    <div className="flex flex-col md:flex-row justify-between md:items-end gap-4 mb-6">
                        <div>
                            <button onClick={onBack} className="mb-4 font-bold text-slate-500 dark:text-slate-400 flex items-center gap-2 hover:text-indigo-600 transition-colors bg-white dark:bg-slate-800 px-4 py-2 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700"><Icons.ArrowRight /> بازگشت به لیست</button>
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-black shadow-sm tracking-widest">CMD-{toPersianNum(eventId)}</span>
                                {ev.status === 'draft' && <span className="bg-amber-100 text-amber-700 px-3 py-1 rounded-lg text-xs font-bold border border-amber-200">پیش‌نویس</span>}
                                {ev.status === 'confirmed' && <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg text-xs font-bold border border-blue-200">قطعی شده</span>}
                                {delegations.length > 0 && <span className="bg-red-500 text-white px-3 py-1 rounded-lg text-xs font-black shadow-sm pulse-text">{toPersianNum(delegations.length)} درخواست واگذاری</span>}
                            </div>
                            <h2 className="text-4xl font-black text-slate-800 dark:text-white tracking-tight">{toPersianNum(ev.title)}</h2>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={openEditModal} className="bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 px-4 py-3 rounded-xl font-bold hover:bg-slate-50 dark:hover:bg-slate-700 shadow-sm transition-colors" title="ویرایش ابعاد رویداد"><Icons.Edit/></button>
                            <button onClick={copyClientLink} className="bg-white dark:bg-slate-800 border-2 border-indigo-100 dark:border-indigo-900 text-indigo-600 dark:text-indigo-400 px-5 py-3 rounded-xl font-bold hover:bg-indigo-50 dark:hover:bg-slate-700 shadow-sm flex items-center gap-2"><Icons.Link/> پورتال کارفرما</button>
                            <select value={ev.status} onChange={e => apiCall('update_event_status', {status: e.target.value})} className="bg-slate-800 dark:bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold outline-none shadow-md cursor-pointer">
                                <option value="draft">وضعیت: پیش‌نویس</option><option value="confirmed">وضعیت: قطعی</option><option value="in_progress">وضعیت: در حال اجرا</option><option value="completed">وضعیت: پایان‌یافته</option>
                            </select>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <div className="bg-white dark:bg-slate-800 p-5 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm relative overflow-hidden">
                            {ev.org_logo && <img src={ev.org_logo} className="absolute left-[-20px] top-[-20px] w-24 h-24 opacity-10 pointer-events-none" />}
                            <div className="text-indigo-400 mb-2"><Icons.Building/></div>
                            <div className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">سازمان و مدیر هماهنگی</div>
                            <div className="font-black text-slate-800 dark:text-white text-base truncate">{toPersianNum(ev.org_name) || '---'}</div>
                            <div className="text-xs text-indigo-600 dark:text-indigo-400 font-bold mt-1">{toPersianNum(ev.contact_name) || 'بدون مدیر هماهنگی'}</div>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-5 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
                            <div className="text-indigo-400 mb-2"><Icons.Calendar/></div>
                            <div className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">شروع رویداد</div>
                            <div className="font-black text-slate-800 dark:text-white text-sm leading-relaxed">{toJalaliDateTime(ev.start_date)}</div>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-5 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
                            <div className="text-indigo-400 mb-2"><Icons.Users/></div>
                            <div className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">مکان و ابعاد</div>
                            <div className="font-black text-slate-800 dark:text-white text-base truncate">{toPersianNum(ev.venue_name) || '---'}</div>
                            <div className="text-xs text-slate-500 dark:text-slate-400 font-bold mt-1">{toPersianNum(ev.guest_count)} مهمان</div>
                        </div>
                        <div className="bg-gradient-to-br from-indigo-500 to-blue-600 p-5 rounded-3xl shadow-lg text-white">
                            <div className="text-indigo-200 mb-2"><Icons.Activity/></div>
                            <div className="text-xs font-bold text-indigo-100 mb-1">پیشرفت کل عملیات</div>
                            <div className="font-black text-3xl mt-1" dir="ltr">{toPersianNum(Math.round((tasks.filter(t=>t.is_done).length / (tasks.length||1))*100))}%</div>
                            <div className="w-full bg-indigo-900/50 h-2 rounded-full mt-3 overflow-hidden"><div className="bg-white h-full transition-all duration-1000" style={{width: `${(tasks.filter(t=>t.is_done).length / (tasks.length||1))*100}%`}}></div></div>
                        </div>
                    </div>

                    <div className="flex gap-2 mb-6 border-b-2 border-slate-200 dark:border-slate-700 pb-2 overflow-x-auto custom-scroll">
                        {[{id:'operations', label:'فازهای عملیاتی'}, {id:'finance', label:'فاکتور تعاملی'}, {id:'team', label:'تخصیص‌ها'}, {id:'logs', label:'گزارشات زنده'}].map(t => (
                            <button key={t.id} onClick={()=>setTab(t.id)} className={`px-6 py-3 rounded-t-xl font-bold whitespace-nowrap transition-colors ${tab===t.id ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-800 dark:hover:text-white'}`}>{t.label}</button>
                        ))}
                    </div>

                    {tab === 'operations' && (
                        <div className="fade-in">
                            <div className="flex flex-wrap gap-2 mb-6 bg-white dark:bg-slate-800 p-2 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                {kanbanCols.map(col => (
                                    <button key={col} onClick={()=>setActivePhase(col)} className={`flex-1 min-w-[120px] py-3 px-4 rounded-xl font-bold text-sm transition-all shadow-sm ${activePhase === col ? 'bg-slate-800 dark:bg-indigo-600 text-white shadow-md transform scale-[1.02]' : 'bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-600 border border-slate-200 dark:border-slate-600'}`}>
                                        {col} <span className={`ml-2 px-2 py-0.5 rounded-md text-[10px] ${activePhase === col ? 'bg-slate-600 dark:bg-indigo-800 text-slate-200' : 'bg-white dark:bg-slate-800 border dark:border-slate-600'}`}>{toPersianNum((tasksByTiming[col] || []).length)}</span>
                                    </button>
                                ))}
                            </div>

                            <div className="bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-3xl p-4 sm:p-8 min-h-[50vh] shadow-inner">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-2xl font-black text-slate-800 dark:text-white">تسک‌های فاز: <span className="text-indigo-600 dark:text-indigo-400">{activePhase}</span></h3>
                                    <button onClick={()=>{const title = prompt(`عنوان وظیفه آزاد برای ${activePhase}:`); if(title) apiCall('add_quick_task', {title: title, timing: activePhase});}} className="bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 font-bold px-4 py-2 rounded-xl hover:bg-indigo-200 dark:hover:bg-indigo-800 transition-colors shadow-sm">+ تسک آزاد</button>
                                </div>
                                
                                <div className="space-y-4">
                                    {(tasksByTiming[activePhase] || []).length === 0 && <div className="text-center py-10 font-bold text-slate-400">هیچ وظیفه‌ای در این فاز ثبت نشده است.</div>}
                                    {(tasksByTiming[activePhase] || []).map(t => {
                                        let isLocked = false; let depTitle = ''; let pureRole = t.role_tag;
                                        if(t.role_tag && t.role_tag.includes('|dep:')) {
                                            const parts = t.role_tag.split('|dep:');
                                            pureRole = parts[0];
                                            depTitle = parts[1];
                                            const parentTask = tasks.find(x => x.title === depTitle);
                                            if(parentTask && parentTask.is_done === 0) isLocked = true;
                                        }

                                        return (
                                        <div key={t.id} className={`p-4 sm:p-5 rounded-2xl border-2 transition-all shadow-sm flex flex-col md:flex-row justify-between md:items-center gap-4 ${isLocked ? 'gray-chain-locked bg-slate-200 dark:bg-slate-800 border-dashed border-slate-300 dark:border-slate-600' : t.has_issue ? 'bg-red-50 dark:bg-red-900/20 border-red-300' : t.is_done ? 'bg-green-50 dark:bg-green-900/20 border-green-200 opacity-70' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-indigo-300 dark:hover:border-indigo-500 hover:shadow-md'}`}>
                                            <div className="flex items-start gap-4">
                                                <button disabled={isLocked} onClick={()=>apiCall('update_task', {task_id: t.id, task_title: t.title, is_done: !t.is_done})} className={`w-12 h-12 shrink-0 rounded-2xl border-2 flex items-center justify-center transition-all mt-1 ${t.is_done ? 'bg-green-500 border-green-500 text-white' : 'bg-slate-50 dark:bg-slate-700 border-slate-300 dark:border-slate-600 text-transparent hover:border-green-400'}`}><Icons.Check/></button>
                                                <div>
                                                    <div className={`font-bold text-lg leading-relaxed ${t.is_done ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-100'}`}>{toPersianNum(t.title)}</div>
